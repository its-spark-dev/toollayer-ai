server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The console is a single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle is content-hashed, so it can be cached indefinitely. index.html cannot,
    # or a deploy would never reach a browser that already has it.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
