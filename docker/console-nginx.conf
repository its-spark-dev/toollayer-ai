# Port 8080 rather than 80 so nginx can run as an unprivileged user: binding below 1024
# needs a capability this container has no reason to hold. docker-compose.yml publishes it
# on the host as 5173.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The nginx version is not information a visitor needs, and it is information an attacker
    # can use to pick an exploit.
    server_tokens off;

    # Security headers are repeated in every location block on purpose. `add_header` does not
    # merge across levels: a location that declares any header of its own drops every
    # server-level one, so a single server-level declaration would silently stop applying to
    # /assets/ the moment that block gained a Cache-Control header — which it has.
    location / {
        # The console is a single-page app: unknown paths are routes, not missing files.
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # The bundle loads no third-party script, font, or image. connect-src has to allow the
        # Control Plane and Runtime origins, which are configured at build time; 'self' plus
        # explicit localhost covers the local topology this file describes.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8082; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    }

    # The bundle is content-hashed, so it can be cached indefinitely. index.html cannot,
    # or a deploy would never reach a browser that already has it.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
