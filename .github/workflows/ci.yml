name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy packages apps

      - name: Test
        run: pytest tests -v

      - name: Documentation matches the code
        run: python scripts/check_docs.py

      - name: Verify the security controls specifically
        # Called out as its own step so a failure here is visibly a *security* regression in
        # the run summary, not one line inside a long test log.
        run: pytest tests/security tests/contract -v

  console:
    name: Build the console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/control-plane/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

      - name: Every Mermaid diagram parses
        # Diagrams that fail to parse render as an error box on GitHub, which is invisible in
        # a normal test run. Parsing them needs a JavaScript runtime, so the check lives here.
        run: npm run check:diagrams

  demo:
    name: End-to-end demo
    runs-on: ubuntu-latest
    needs: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the demonstration against real services
        # The demo script exits non-zero if any control fails to reject, so this is a real
        # assertion about the running system rather than a screenshot generator.
        run: ./scripts/run_demo.sh

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-logs
          path: .demo-logs/
          retention-days: 7

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Private notes must never be committed
        run: |
          if git log --all --name-only --pretty=format: | grep -q '^private-notes/'; then
            echo "::error::private-notes/ appears in Git history"
            exit 1
          fi
          echo "private-notes/ is absent from history"

      - name: Commits must carry no co-author or AI attribution trailer
        run: |
          pattern='Co-authored-by|Co-Author|Generated-by|Created-by|Assisted-by'
          if git log --all --pretty=format:%B | grep -Eiq "$pattern"; then
            echo "::error::a commit message carries an attribution trailer"
            git log --all --pretty=format:'%h %s%n%b' | grep -Ei -B2 "$pattern" || true
            exit 1
          fi
          echo "no attribution trailers found"

      - name: The example environment file must contain no real-looking secret
        run: |
          if grep -Eiq '(sk-|ghp_|AKIA|BEGIN [A-Z ]*PRIVATE KEY)' .env.example; then
            echo "::error::.env.example contains something that looks like a credential"
            exit 1
          fi
          echo ".env.example contains only placeholders"
