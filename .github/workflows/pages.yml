name: Pages

# Publishes docs/site/ — a static summary for a reader who will not clone the repository.
#
# There is no backend behind it and the workflow adds none: the job copies the page and the
# already-committed capture assets, and nothing else. If it ever starts needing a build step,
# that is a signal the page has grown past what it is for.
#
# Requires Pages to be enabled for the repository with "GitHub Actions" as the source
# (Settings → Pages → Build and deployment → Source). Until that is set, this workflow runs
# and its deploy step fails; nothing else in CI depends on it.

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Not cancel-in-progress: cancelling a half-finished deployment can leave the site serving
  # a mixture of two versions.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble the site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy the page and its assets
        # The assets are the same files the README shows, committed and generated by
        # `make capture` from the running application. Copying rather than re-capturing keeps
        # the site and the README showing identical images.
        run: |
          mkdir -p _site/assets
          cp docs/site/index.html _site/index.html
          cp docs/assets/*.png _site/assets/
          cp docs/assets/*.webm _site/assets/
          # A 404 that goes somewhere useful, since the site is a single page.
          cp docs/site/index.html _site/404.html
          ls -la _site _site/assets

      - name: Every asset the page references exists
        run: |
          missing=0
          for asset in $(grep -oE '(src|href)="assets/[^"]+"' _site/index.html \
                         | sed -E 's/.*"assets\/(.*)"/\1/' | sort -u); do
            if [ ! -f "_site/assets/${asset}" ]; then
              echo "::error::the page references a missing asset: ${asset}"
              missing=1
            fi
          done
          [ "$missing" = "0" ] && echo "every referenced asset is present"
          exit "$missing"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      # The one place this repository grants more than read, and only for the Pages
      # deployment itself.
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
