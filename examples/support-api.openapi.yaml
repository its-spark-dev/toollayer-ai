openapi: 3.1.0
info:
  title: Sample Support API
  version: 1.0.0
  summary: A synthetic support-ticket API used to demonstrate ToolLayer AI.
  description: >-
    Every ticket, team, and person described by this API is fabricated for demonstration
    purposes. This document is the input to the Tool Control Plane: it is hand-authored so
    that the conversion pipeline is exercised against a specification a person wrote.

servers:
  - url: http://localhost:8081

tags:
  - name: tickets
    description: Reading and updating support tickets.
  - name: teams
    description: Support teams and their members.

paths:
  /v1/tickets:
    get:
      operationId: listSupportTickets
      tags: [tickets]
      summary: List support tickets
      description: >-
        Search the support queue. Every filter is optional; combining filters narrows the
        result. Use this to answer questions about which tickets are open, urgent,
        unassigned, or owned by a particular team.
      parameters:
        - name: status
          in: query
          required: false
          description: Return only tickets currently in this status.
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: priority
          in: query
          required: false
          description: Return only tickets at this priority.
          schema:
            $ref: '#/components/schemas/TicketPriority'
        - name: team_id
          in: query
          required: false
          description: Return only tickets owned by this team.
          schema:
            type: string
            maxLength: 64
        - name: assignee_id
          in: query
          required: false
          description: Return only tickets currently assigned to this team member.
          schema:
            type: string
            maxLength: 64
        - name: unassigned_only
          in: query
          required: false
          description: When true, return only tickets that have no assignee.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Maximum number of tickets to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: The matching tickets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'

  /v1/tickets/{ticket_id}:
    get:
      operationId: getSupportTicket
      tags: [tickets]
      summary: Retrieve one support ticket
      description: Return the full detail of a single ticket, including its message body.
      parameters:
        - name: ticket_id
          in: path
          required: true
          description: The identifier of the ticket, for example TKT-1001.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: The requested ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: No ticket exists with that identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/tickets/{ticket_id}/assignment:
    post:
      operationId: assignSupportTicket
      tags: [tickets]
      summary: Assign a support ticket to a team member
      description: >-
        Hand a ticket to a specific team member. The assignee must belong to the team that
        owns the ticket. Assigning an open ticket also moves it to in_progress.
      parameters:
        - name: ticket_id
          in: path
          required: true
          description: The identifier of the ticket to assign.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      responses:
        '200':
          description: The updated ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: The ticket or the team member does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The assignee does not belong to the team that owns the ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/tickets/{ticket_id}/status:
    post:
      operationId: changeSupportTicketStatus
      tags: [tickets]
      summary: Change the status of a support ticket
      description: >-
        Move a ticket to a new status. Not every transition is allowed; a closed ticket must
        be reopened through resolved. This operation changes customer-visible state.
      parameters:
        - name: ticket_id
          in: path
          required: true
          description: The identifier of the ticket to update.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      responses:
        '200':
          description: The updated ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: The requested transition is not allowed from the current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/teams:
    get:
      operationId: listSupportTeams
      tags: [teams]
      summary: List support teams
      description: Return every support team, with its time zone and escalation address.
      responses:
        '200':
          description: The support teams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamList'

  /v1/teams/{team_id}/members:
    get:
      operationId: listSupportTeamMembers
      tags: [teams]
      summary: List the members of one support team
      description: >-
        Return the people on a team, optionally narrowed to those currently available. Use
        this before assigning a ticket to find a suitable assignee.
      parameters:
        - name: team_id
          in: path
          required: true
          description: The identifier of the team, for example team-billing.
          schema:
            type: string
            maxLength: 64
        - name: available_only
          in: query
          required: false
          description: When true, return only members who are currently available.
          schema:
            type: boolean
      responses:
        '200':
          description: The team members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'

components:
  schemas:
    TicketStatus:
      type: string
      description: The workflow state of a ticket.
      enum: [open, in_progress, waiting_on_customer, resolved, closed]

    TicketPriority:
      type: string
      description: How urgent the ticket is.
      enum: [low, medium, high, urgent]

    Ticket:
      type: object
      additionalProperties: false
      required: [ticket_id, subject, status, priority, team_id]
      properties:
        ticket_id: { type: string }
        subject: { type: string }
        body: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        team_id: { type: string }
        assignee_id: { type: string }
        requester: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        tags:
          type: array
          items: { type: string }

    TicketList:
      type: object
      additionalProperties: false
      required: [items, total_matched, returned]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        total_matched: { type: integer }
        returned: { type: integer }

    AssignmentRequest:
      type: object
      additionalProperties: false
      required: [assignee_id]
      properties:
        assignee_id:
          type: string
          maxLength: 64
          description: The identifier of the team member who should own the ticket.
        note:
          type: string
          maxLength: 280
          description: An optional handover note recorded with the assignment.

    StatusChangeRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
          description: The status the ticket should move to.
        resolution_note:
          type: string
          maxLength: 280
          description: An optional note explaining the change.

    Team:
      type: object
      additionalProperties: false
      required: [team_id, name]
      properties:
        team_id: { type: string }
        name: { type: string }
        time_zone: { type: string }
        escalation_email: { type: string }

    TeamList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Team' }

    Member:
      type: object
      additionalProperties: false
      required: [member_id, team_id, display_name]
      properties:
        member_id: { type: string }
        team_id: { type: string }
        display_name: { type: string }
        role: { type: string }
        available: { type: boolean }
        open_ticket_count: { type: integer }

    MemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Member' }

    Problem:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
